services:
  postgres-db:
    image: postgres:16-alpine
    container_name: harkat_postgres_container
    restart: always
    environment:
      POSTGRES_USER: "jua"
      POSTGRES_PASSWORD: "070705"
      POSTGRES_DB: harkat_store_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_volume:/var/lib/postgresql/data

volumes:
  postgres_data_volume: